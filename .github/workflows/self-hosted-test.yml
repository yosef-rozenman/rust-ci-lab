
name: Self-hosted Runner Test

on:
  workflow_dispatch:

jobs:
  test-linux:
    runs-on: [self-hosted, Linux, X64, ib]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test

  test-windows:
    runs-on: [self-hosted, Windows, X64, ib]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test
